        /* =========================================================================
         * 1. 音響システム (Web Audio API による効果音)
         * ========================================================================= */
        class TimeAudioEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.isInitialized = false;
            }

            init() {
                if (this.isInitialized) return;
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    this.isInitialized = true;
                } catch (e) {
                    console.warn("Web Audio API not supported", e);
                }
            }

            playDoorOpenSFX() {
                if (!this.enabled || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.8);
                
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.2);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.8);

                this.playClickSound(180, 0.15);
            }

            playWarpSFX() {
                if (!this.enabled || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 1.2);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.4, now + 0.6);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 1.2);
            }

            playClickSound(freq = 440, duration = 0.05) {
                if (!this.enabled || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + duration);
            }
        }

        const ERA_KEYS = Object.keys(ERA_DATA);

        /* =========================================================================
         * 3. Three.js 360°パノラマドーム & どこでもドア構築
         * ========================================================================= */
        let scene, camera, renderer, controls;
        let doorGroup, doorPivot, doorLeaf, doorSignMesh;
        let panoramaSphere, panoramaTextureLoader;
        let isDoorOpen = false;
        let isInsideEra = false;
        let currentEra = 'jomon';

        function init3D() {
            const canvas = document.getElementById('webgl-canvas');
            
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.3, 3.2);

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;
            controls.minDistance = 0.2;
            controls.maxDistance = 12;
            controls.target.set(0, 1.2, 0);

            panoramaTextureLoader = new THREE.TextureLoader();

            // ライティング
            setupLighting();

            // 床（グリッド）
            createGround();

            // どこでもドア構築
            createDokodemoDoor();

            // 360度パノラマ背景ドーム作成
            createPanoramaSphere();

            // UIの時代選択タブ動的生成
            renderEraTabs();

            // イベントリスナー
            window.addEventListener('resize', onWindowResize);
            setupRaycaster();

            // アニメーションループ開始
            animate();
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);
        }

        function createGround() {
            const grid = new THREE.GridHelper(30, 30, 0xff4757, 0x334155);
            grid.position.y = 0;
            scene.add(grid);
        }

        function createDokodemoDoor() {
            doorGroup = new THREE.Group();
            doorGroup.position.set(0, 0, 0);

            const frameWidth = 1.3;
            const frameHeight = 2.4;
            const frameDepth = 0.12;
            const thickness = 0.1;

            const pinkMaterial = new THREE.MeshStandardMaterial({
                color: 0xff3b5c,
                roughness: 0.3,
                metalness: 0.1
            });

            const goldMaterial = new THREE.MeshStandardMaterial({
                color: 0xfbc02d,
                roughness: 0.2,
                metalness: 0.8
            });

            // 外枠
            const leftFrame = new THREE.Mesh(new THREE.BoxGeometry(thickness, frameHeight, frameDepth), pinkMaterial);
            leftFrame.position.set(-frameWidth / 2 + thickness / 2, frameHeight / 2, 0);
            doorGroup.add(leftFrame);

            const rightFrame = new THREE.Mesh(new THREE.BoxGeometry(thickness, frameHeight, frameDepth), pinkMaterial);
            rightFrame.position.set(frameWidth / 2 - thickness / 2, frameHeight / 2, 0);
            doorGroup.add(rightFrame);

            const topFrame = new THREE.Mesh(new THREE.BoxGeometry(frameWidth, thickness, frameDepth), pinkMaterial);
            topFrame.position.set(0, frameHeight - thickness / 2, 0);
            doorGroup.add(topFrame);

            // ドア上部に時代名・年代を表示する看板プレートを作成
            const signGeo = new THREE.PlaneGeometry(1.6, 0.45);
            const signMat = new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide });
            doorSignMesh = new THREE.Mesh(signGeo, signMat);
            doorSignMesh.position.set(0, frameHeight + 0.32, 0);
            doorGroup.add(doorSignMesh);

            // 扉（回転軸ピボット）
            doorPivot = new THREE.Group();
            doorPivot.position.set(-frameWidth / 2 + thickness, 0, 0);

            const innerWidth = frameWidth - thickness * 2;
            const innerHeight = frameHeight - thickness;

            doorLeaf = new THREE.Mesh(new THREE.BoxGeometry(innerWidth, innerHeight, 0.06), pinkMaterial);
            doorLeaf.position.set(innerWidth / 2, innerHeight / 2, 0);
            doorLeaf.name = "clickableDoor";

            // ドアノブ
            const knobBase = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.08, 16), goldMaterial);
            knobBase.rotation.x = Math.PI / 2;
            knobBase.position.set(innerWidth - 0.12, innerHeight / 2, 0.05);

            const knobBall = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 16), goldMaterial);
            knobBall.position.set(innerWidth - 0.12, innerHeight / 2, 0.09);

            doorLeaf.add(knobBase);
            doorLeaf.add(knobBall);

            doorPivot.add(doorLeaf);
            doorGroup.add(doorPivot);

            scene.add(doorGroup);

            // 看板の初期描画
            updateDoorSign(currentEra);
        }

        // ドア上部の看板に時代名と年代を描画する関数
        function updateDoorSign(eraKey) {
            const data = ERA_DATA[eraKey];
            if (!data || !doorSignMesh) return;

            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 144;
            const ctx = canvas.getContext('2d');

            // 背景プレート（丸角グラデーション）
            const grad = ctx.createLinearGradient(0, 0, 512, 144);
            grad.addColorStop(0, 'rgba(255, 71, 87, 0.95)');
            grad.addColorStop(1, 'rgba(255, 107, 129, 0.95)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(10, 10, 492, 124, 20);
            } else {
                ctx.rect(10, 10, 492, 124);
            }
            ctx.fill();

            // 枠線
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#fbc02d';
            ctx.stroke();

            // 時代名テキスト
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 44px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 8;
            ctx.fillText(data.title, 256, 52);

            // 年代テキスト
            ctx.fillStyle = '#ffeaa7';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText(data.year, 256, 98);

            const texture = new THREE.CanvasTexture(canvas);
            doorSignMesh.material.map = texture;
            doorSignMesh.material.needsUpdate = true;
        }

        /* 時空ポータル（時空の渦）テクスチャ作成 */
        function createPortalTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // 宇宙・時空トンネル風の背景
            const grad = ctx.createRadialGradient(512, 256, 20, 512, 256, 500);
            grad.addColorStop(0, '#ff4757');
            grad.addColorStop(0.3, '#8e44ad');
            grad.addColorStop(0.7, '#2c3e50');
            grad.addColorStop(1, '#0b0f19');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 同心円と放射線（ポータル線）
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 2;
            for (let r = 30; r < 600; r += 40) {
                ctx.beginPath();
                ctx.arc(512, 256, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.font = 'bold 36px sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText('🌀 時空ポータル発動中', 512, 230);
            ctx.font = '24px sans-serif';
            ctx.fillStyle = '#ffeaa7';
            ctx.fillText('「時代の中に潜入する！」を押すとタイムスリップ！', 512, 290);

            return new THREE.CanvasTexture(canvas);
        }

        function showPortalView() {
            if (panoramaSphere) {
                panoramaSphere.material.map = createPortalTexture();
                panoramaSphere.material.needsUpdate = true;
            }
        }

        /* 360度パノラマ表示用球体の作成 */
        function createPanoramaSphere() {
            // 半径40の巨大な内向き球体
            const geometry = new THREE.SphereGeometry(40, 60, 40);
            // 内側にテクスチャを貼るため Side: BackSide
            const material = new THREE.MeshBasicMaterial({
                side: THREE.BackSide
            });
            panoramaSphere = new THREE.Mesh(geometry, material);
            
            // 内側からの視点による左右反転（鏡文字）を修正
            panoramaSphere.scale.set(-1, 1, 1);

            // ドアの奥（中心をドア付近に配置）
            panoramaSphere.position.set(0, 1.2, -5);
            scene.add(panoramaSphere);

            // 初期表示はポータル画面
            showPortalView();
        }

        // キャンバスで動的に美しい時代のグラデーションパノラマを生成（画像フォールバック用）
        function createFallbackPanoramaTexture(eraKey) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const data = ERA_DATA[eraKey];
            const hexColor = data ? data.color : '#ff4757';

            // 背景グラデーション
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0b0f19');
            grad.addColorStop(0.5, hexColor);
            grad.addColorStop(1, '#111827');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 光のグリッドラインとグリッド描画
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            for (let i = 0; i < canvas.width; i += 64) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 64) {
                ctx.beginPath();
                ctx.moveTo(0, j);
                ctx.lineTo(canvas.width, j);
                ctx.stroke();
            }

            // 時代タイトルテキスト描画
            ctx.font = 'bold 48px sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText(`【360° Panorama】${data.title} (${data.year})`, canvas.width / 2, canvas.height / 2);
            ctx.font = '24px sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillText(`(手動設定でパノラマ画像URLを追加できます)`, canvas.width / 2, canvas.height / 2 + 50);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // 360度パノラマテクスチャの読み込み・適用
        function loadEraPanorama(eraKey) {
            const data = ERA_DATA[eraKey];
            if (!data) return;

            if (data.panoramaUrl && data.panoramaUrl.trim() !== "") {
                panoramaTextureLoader.load(
                    data.panoramaUrl,
                    (texture) => {
                        panoramaSphere.material.map = texture;
                        panoramaSphere.material.needsUpdate = true;
                    },
                    undefined,
                    () => {
                        // エラー時フォールバック
                        panoramaSphere.material.map = createFallbackPanoramaTexture(eraKey);
                        panoramaSphere.material.needsUpdate = true;
                    }
                );
            } else {
                panoramaSphere.material.map = createFallbackPanoramaTexture(eraKey);
                panoramaSphere.material.needsUpdate = true;
            }
        }

        function renderEraTabs() {
            const container = document.getElementById('era-cards-container');
            container.innerHTML = '';

            ERA_KEYS.forEach(key => {
                const era = ERA_DATA[key];
                const card = document.createElement('div');
                card.className = `era-card flex-shrink-0 px-3.5 py-2 rounded-xl glass-btn text-center border ${key === currentEra ? 'active' : ''}`;
                card.setAttribute('data-era', key);
                card.innerHTML = `
                    <div class="text-[10px] text-gray-300 leading-tight">${era.year}</div>
                    <div class="text-xs font-bold text-white mt-0.5"><i class="fa-solid ${era.icon} mr-1" style="color:${era.color}"></i>${era.title}</div>
                `;

                card.addEventListener('click', () => {
                    document.querySelectorAll('.era-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    audioEngine.playClickSound(520, 0.08);

                    currentEra = key;
                    updateDoorSign(key);

                    // 既に潜入中の場合は、即座に新しい時代の映像に切り替え
                    if (isInsideEra) {
                        loadEraPanorama(key);
                    } else {
                        showPortalView();
                    }
                    updateUIState();
                });

                container.appendChild(card);
            });
        }

        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        function setupRaycaster() {
            const canvas = document.getElementById('webgl-canvas');
            canvas.addEventListener('pointerdown', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                if (doorLeaf) {
                    const intersects = raycaster.intersectObject(doorLeaf, true);
                    if (intersects.length > 0) {
                        toggleDoor();
                    }
                }
            });
        }

        function toggleDoor() {
            isDoorOpen = !isDoorOpen;
            if (isDoorOpen) {
                audioEngine.playDoorOpenSFX();
                gsap.to(doorPivot.rotation, {
                    y: -Math.PI * 0.65,
                    duration: 1.2,
                    ease: "back.out(1.2)"
                });
            } else {
                audioEngine.playClickSound(300, 0.1);
                gsap.to(doorPivot.rotation, {
                    y: 0,
                    duration: 0.8,
                    ease: "power2.inOut"
                });
                if (isInsideEra) {
                    exitEraWorld();
                }
            }
            updateUIState();
        }

        // ドアをくぐって360度パノラマ空間の中に完全進入
        function enterEraWorld() {
            if (!isDoorOpen) return;
            isInsideEra = true;
            audioEngine.playWarpSFX();

            // 潜入時に時代の360度パノラマ映像を読み込んで表示
            loadEraPanorama(currentEra);

            // ドアを通り抜けてパノラマ球体の中心（Z = -5）付近へカメラ移動
            gsap.to(camera.position, {
                x: 0,
                y: 1.2,
                z: -4.8,
                duration: 1.6,
                ease: "power2.inOut",
                onUpdate: () => controls.target.set(0, 1.2, -5),
                onComplete: () => {
                    controls.target.set(0, 1.2, -5.1);
                    updateUIState();
                }
            });
        }

        function exitEraWorld() {
            isInsideEra = false;
            // 戻ったらポータル表示に戻す
            showPortalView();

            gsap.to(camera.position, {
                x: 0,
                y: 1.3,
                z: 3.2,
                duration: 1.5,
                ease: "power2.inOut",
                onUpdate: () => controls.target.set(0, 1.2, 0),
                onComplete: () => {
                    controls.target.set(0, 1.2, 0);
                    updateUIState();
                }
            });
        }

        function updateUIState() {
            const doorBtnText = document.getElementById('door-btn-text');
            const doorBtnIcon = document.getElementById('door-btn-icon');
            const btnEnter = document.getElementById('btn-enter-era');
            const btnExit = document.getElementById('btn-exit-era');
            const btnToggle = document.getElementById('btn-toggle-door');
            const instructionText = document.getElementById('instruction-text');

            if (!instructionText) return;

            const eraTitle = ERA_DATA[currentEra].title;

            if (isInsideEra) {
                instructionText.textContent = `${eraTitle} (360°パノラマ) の世界を探検中！画面をスワイプで見渡せます`;
                btnToggle.classList.add('hidden');
                btnEnter.classList.add('hidden');
                btnExit.classList.remove('hidden');
            } else if (isDoorOpen) {
                instructionText.textContent = `【${eraTitle}】へのドアが開きました！「潜入する」を押して中へ！`;
                doorBtnText.textContent = "ドアを閉める";
                doorBtnIcon.className = "fa-solid fa-door-closed";
                btnEnter.classList.remove('hidden');
                btnExit.classList.add('hidden');
                btnToggle.classList.remove('hidden');
            } else {
                instructionText.textContent = "ドアを開けて、過去の時代を覗いてみよう！";
                doorBtnText.textContent = "どこでもドアを開ける";
                doorBtnIcon.className = "fa-solid fa-door-open";
                btnEnter.classList.add('hidden');
                btnExit.classList.add('hidden');
                btnToggle.classList.remove('hidden');
            }
        }

        async function toggleCameraAR() {
            const video = document.getElementById('camera-video');
            const arText = document.getElementById('ar-text');

            if (!isCameraActive) {
                try {
                    // 外カメラ（背面）優先で多段階フォールバック取得
                    const constraintsList = [
                        { video: { facingMode: { exact: "environment" } } },
                        { video: { facingMode: "environment" } },
                        { video: true }
                    ];

                    let stream = null;
                    for (const constraint of constraintsList) {
                        try {
                            stream = await navigator.mediaDevices.getUserMedia(constraint);
                            if (stream) break;
                        } catch (e) {
                            // 次のカメラ条件を試行
                        }
                    }

                    if (!stream) {
                        throw new Error("Camera stream not available");
                    }

                    video.srcObject = stream;
                    video.muted = true; // ブラウザの自動再生ブロック回避
                    await video.play();

                    // Canvas背景を透明化し、背後のHTML5 Videoを表示
                    video.classList.remove('hidden');
                    scene.background = null;
                    renderer.setClearColor(0x000000, 0);

                    isCameraActive = true;
                    arText.textContent = "ARカメラ: ON";
                } catch (err) {
                    console.error("Camera access error:", err);
                    const instructionText = document.getElementById('instruction-text');
                    if (instructionText) {
                        instructionText.textContent = "⚠️ カメラへのアクセスができません（HTTPS環境や権限の許可が必要です）";
                    }
                    setTimeout(() => updateUIState(), 4000);
                }
            } else {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }
                video.classList.add('hidden');
                scene.background = new THREE.Color(0x0b0f19);
                renderer.setClearColor(0x0b0f19, 1);
                isCameraActive = false;
                arText.textContent = "ARカメラ: OFF";
            }
        }

        function setupEventListeners() {
            document.getElementById('btn-toggle-door').addEventListener('click', toggleDoor);
            document.getElementById('btn-enter-era').addEventListener('click', enterEraWorld);
            document.getElementById('btn-exit-era').addEventListener('click', exitEraWorld);

            document.getElementById('btn-sound-toggle').addEventListener('click', () => {
                audioEngine.enabled = !audioEngine.enabled;
                const icon = document.getElementById('sound-icon');
                icon.className = audioEngine.enabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
            });

            // モーダル (解説ダイアログ)
            const modal = document.getElementById('info-modal');
            const openModal = () => {
                const data = ERA_DATA[currentEra];
                document.getElementById('modal-era-title').textContent = `${data.title} (${data.year})`;
                document.getElementById('modal-era-subtitle').textContent = "日本の歴史探訪ガイド";
                document.getElementById('modal-era-body').innerHTML = data.description;
                document.getElementById('modal-era-icon').innerHTML = `<i class="fa-solid ${data.icon}" style="color:${data.color}"></i>`;
                
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
            };

            const closeModal = () => {
                modal.classList.add('opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 300);
            };

            document.getElementById('btn-info').addEventListener('click', openModal);
            document.getElementById('btn-close-modal').addEventListener('click', closeModal);
            document.getElementById('btn-modal-action').addEventListener('click', closeModal);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // ドーム背景のゆっくりとした自転
            if (panoramaSphere) {
                panoramaSphere.rotation.y += 0.0003;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('load', () => {
            init3D();
            setupEventListeners();
        });
    </script>
</body>
